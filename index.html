<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embed Wrapper</title>
  <style>
    /* Reset margins and paddings so the iframe fills 100% of the Canva embed container */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
    }

    /* Outer wrapper container */
    .iframe-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Nested iframe styling */
    .wrapper-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="iframe-container" id="container">
    <!-- OPTION A: Hardcode your desired URL directly in the src attribute below -->
    <iframe 
      id="nestedIframe" 
      class="wrapper-iframe" 
      src="https://example.com" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      allowfullscreen>
    </iframe>
  </div>

  <script>
    // OPTION B: Dynamic URL loading via query parameter
    // If you add ?url=https://your-target-url.com to your GitHub Pages link in Canva,
    // this script automatically loads it into the inner iframe.
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('url');

    if (targetUrl) {
      document.getElementById('nestedIframe').src = targetUrl;
    }
  </script>

</body>
</html>
