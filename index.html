<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embed Wrapper</title>

  <!-- Canva needs these tags to generate a preview and accept the link! -->
  <meta property="og:title" content="Cloud-20 Games">
  <meta property="og:description" content="Embed wrapper for Canva">
  <meta property="og:type" content="website">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
    }
    .iframe-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .wrapper-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="iframe-container" id="container">
    <iframe 
      id="nestedIframe" 
      class="wrapper-iframe" 
      src="https://example.com" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      allowfullscreen>
    </iframe>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('url');
    if (targetUrl) {
      document.getElementById('nestedIframe').src = targetUrl;
    }
  </script>
</body>
</html>
